name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fake claude, no API calls)
        run: python -m unittest discover -s tests -v

  validate:
    name: validate plugin files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Manifests are valid JSON and names match
        run: |
          python - <<'PY'
          import json
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          assert plugin["name"] == "cc-paid-fix", plugin["name"]
          names = [p["name"] for p in market["plugins"]]
          assert plugin["name"] in names, names
          print("ok:", plugin["name"], plugin.get("version"))
          PY
      - name: Every skill has name and description frontmatter
        run: |
          python - <<'PY'
          import glob, re
          files = sorted(glob.glob("skills/*/SKILL.md"))
          assert files, "no skills found"
          for f in files:
              head = open(f).read().split("---")[1]
              for field in ("name", "description"):
                  assert re.search(rf"^{field}:\s*\S", head, re.M), f"{f}: missing {field}"
              print("ok:", f)
          PY
      - name: Python compiles and has no tracked secrets or local paths
        run: |
          python -m compileall -q scripts tests
          ! git grep -n -E "sk-ant-[A-Za-z0-9_-]{20,}|/Users/[a-z]" -- . ':!.github'
